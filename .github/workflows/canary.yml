name: TIP-Canary

# Gestartet wird der Workflow von außen (cron-job.org, werktags 22:17 Uhr
# deutscher Zeit) oder von Hand ("Run workflow"). Es gibt bewusst keinen
# eigenen Zeitplan in GitHub: Die Zeiten dort sind nur in UTC angebbar und
# werden von GitHub oft stark verzögert.
on:
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: canary.py ausführen
        shell: bash
        run: python canary.py | tee canary_output.txt

      - name: Push senden
        run: python lib/ntfy_push.py canary_output.txt

      - name: Fehler melden
        if: failure()
        run: |
          curl -s -H "Title: TIP-Canary: Lauf fehlgeschlagen" -H "Priority: 4" \
            -d "Kein Signal erhalten. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://ntfy.sh/$NTFY_TOPIC"
